<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>회원가입 · 모여</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/workspace.css">
</head>
<body class="auth-page">
  <main class="auth-card" aria-labelledby="auth-heading">
    <div class="app-brand">
      <span class="brand-icon"><svg class="app-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="17" cy="6" r="2.5"/><circle cx="7" cy="18" r="2.5"/><path d="M14.5 6H7a3 3 0 0 0 0 6h10a3 3 0 0 1 0 6H9.5"/></svg></span>
      <span>모여</span>
    </div>
    <h1 id="auth-heading">회원가입</h1>
    <p class="muted">계정을 만들고 여행을 시작해요.</p>
    <p id="mode" role="status"></p>
    <p id="error" role="alert"></p>
    <button id="retry" type="button" hidden>다시 시도</button>
    <form id="auth" class="entry-form" method="post" data-action="register">
      <label>이름<input name="name" autocomplete="name" required></label>
      <label>이메일<input name="email" type="email" autocomplete="email" required></label>
      <label>비밀번호<input name="password" type="password" autocomplete="new-password" minlength="8" required></label>
      <label>비밀번호 확인<input name="password_confirmation" type="password" autocomplete="new-password" minlength="8" required></label>
      <button class="primary-button" type="submit" disabled>회원가입</button>
    </form>
    <p>이미 계정이 있나요? <a href="/login.html" data-app-link>로그인</a></p>
  </main>
  <script type="module" src="/src/auth-page.js"></script>
</body>
</html>
