<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>로그인 · 모여</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/workspace.css">
</head>
<body class="auth-page">
  <main class="auth-card" aria-labelledby="auth-heading">
    <div class="app-brand">
      <span class="brand-icon"><svg class="app-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="17" cy="6" r="2.5"/><circle cx="7" cy="18" r="2.5"/><path d="M14.5 6H7a3 3 0 0 0 0 6h10a3 3 0 0 1 0 6H9.5"/></svg></span>
      <span>모여</span>
    </div>
    <h1 id="auth-heading">로그인</h1>
    <p class="muted">함께 여행을 계획해요.</p>
    <p id="mode" role="status"></p>
    <p id="error" role="alert"></p>
    <button id="retry" type="button" hidden>다시 시도</button>
    <form id="auth" class="entry-form" method="post" data-action="login">
      <label>이메일<input name="email" type="email" autocomplete="email" required></label>
      <label>비밀번호<input name="password" type="password" autocomplete="current-password" required></label>
      <button class="primary-button" type="submit" disabled>로그인</button>
    </form>
    <p>계정이 없으신가요? <a href="/signup.html" data-app-link>회원가입</a></p>
  </main>
  <script type="module" src="/src/auth-page.js"></script>
</body>
</html>
