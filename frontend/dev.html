<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>개발자 작업 trace</title><link rel="stylesheet" href="/styles.css"></head>
<body><header><h1>개발자 작업 trace</h1><span>일반 사용자 SSE와 분리</span></header><div id="mode"></div><div id="error" role="alert"></div>

<script type="module" src="/src/dev-trace.js"></script></body></html>
