<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>로그인 · 모여</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="/styles.css">
</head>
<body class="auth-body">
<main class="auth-shell">
  <section class="auth-intro" aria-hidden="true">
    <div class="brand"><span class="brand-mark"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="6.5" cy="6.5" r="2.5"/><circle cx="17.5" cy="17.5" r="2.5"/><path d="M9 6.5h6a3.5 3.5 0 0 1 0 7H9a3.5 3.5 0 0 0 0 7h6"/></svg></span><strong>모여</strong></div>
    <h2>친구들과 이야기하면<br>여행 계획이 모여요</h2>
    <ul class="auth-points">
      <li><span class="dot-step">1</span>대화 속 가고 싶은 곳을 계획 도우미가 정리해요</li>
      <li><span class="dot-step">2</span>동선·경비를 함께 보고 조건이 맞는지 확인해요</li>
      <li><span class="dot-step">3</span>모두 확인하면 같은 여행안으로 확정돼요</li>
    </ul>
    <div class="auth-bubbles"><p class="b-other">우리 제주도로 여행 가자!</p><p class="b-mine">좋아, 나도 찬성</p><p class="b-agent">여행안 r3 준비됐어요 · 4명 확인 대기</p></div>
  </section>
  <section class="auth-card">
    <h1>다시 만나서 반가워요</h1>
    <p class="muted">이메일과 비밀번호로 로그인하세요.</p>
    <p id="mode" class="muted small" role="status"></p>
    <div id="error" class="auth-error" role="alert"></div>
    <button id="retry" type="button" class="ghost" hidden>연결 다시 시도</button>
    <form id="login-form" novalidate>
      <label>이메일<input name="email" type="email" required autocomplete="email" autofocus></label>
      <label>비밀번호<input name="password" type="password" required autocomplete="current-password" minlength="8"></label>
      <button type="submit" class="primary lg wide" disabled>로그인</button>
    </form>
    <p class="auth-switch">처음이신가요? <a data-keep-next data-app-link href="/signup">회원가입</a></p>
  </section>
</main>
<script type="module" src="/src/auth-page.js"></script>
</body>
</html>
